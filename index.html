<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>JARVIS - Autonomous Multimodal AI</title>
    <meta name="description" content="Autonomous Multimodal AI & Personal Companion" />
    <script>
      (function() {
        // 1. Completely virtualize Vite HMR WebSockets so Vite client never errors in AI Studio iFrame / preview
        var OriginalWebSocket = window.WebSocket;
        if (OriginalWebSocket) {
          window.WebSocket = function(url, protocols) {
            var urlStr = String(url || '');
            var isViteHmr = false;
            if (typeof protocols === 'string' && protocols.indexOf('vite-hmr') !== -1) {
              isViteHmr = true;
            } else if (Array.isArray(protocols) && protocols.indexOf('vite-hmr') !== -1) {
              isViteHmr = true;
            } else if (urlStr.indexOf('token=') !== -1 || urlStr.indexOf('/@vite/') !== -1) {
              isViteHmr = true;
            }

            if (isViteHmr) {
              var fakeWs = {
                readyState: 1, // OPEN
                protocol: 'vite-hmr',
                url: urlStr,
                binaryType: 'blob',
                bufferedAmount: 0,
                extensions: '',
                onopen: null,
                onmessage: null,
                onerror: null,
                onclose: null,
                send: function() {},
                close: function() {
                  fakeWs.readyState = 3;
                },
                addEventListener: function(type, fn) {
                  fakeWs['on' + type] = fn;
                },
                removeEventListener: function(type) {
                  fakeWs['on' + type] = null;
                },
                dispatchEvent: function() { return true; }
              };

              setTimeout(function() {
                if (typeof fakeWs.onopen === 'function') {
                  fakeWs.onopen({ type: 'open', target: fakeWs });
                }
                if (typeof fakeWs.onmessage === 'function') {
                  fakeWs.onmessage({ data: JSON.stringify({ type: 'connected' }), target: fakeWs });
                }
              }, 15);

              return fakeWs;
            }

            // Real WebSockets (such as JARVIS live multimodal stream) use native WebSocket
            return new OriginalWebSocket(url, protocols);
          };

          window.WebSocket.prototype = OriginalWebSocket.prototype;
          window.WebSocket.CONNECTING = 0;
          window.WebSocket.OPEN = 1;
          window.WebSocket.CLOSING = 2;
          window.WebSocket.CLOSED = 3;
        }

        // 2. Completely suppress any Vite websocket error console output
        var origConsoleError = console.error;
        console.error = function() {
          var allArgs = Array.prototype.slice.call(arguments);
          var joined = allArgs.map(function(a) { return String((a && a.message) || a || ''); }).join(' ');
          if (
            joined.indexOf('failed to connect to websocket') !== -1 ||
            joined.indexOf('WebSocket closed without opened') !== -1 ||
            (joined.indexOf('[vite]') !== -1 && joined.indexOf('websocket') !== -1)
          ) {
            return;
          }
          origConsoleError.apply(console, allArgs);
        };

        // 3. Suppress window-level unhandled errors and rejections related to Vite websocket
        window.addEventListener('error', function (event) {
          var msg = event && event.message ? String(event.message) : '';
          if (
            msg.indexOf('WebSocket') !== -1 ||
            msg.indexOf('websocket') !== -1 ||
            msg.indexOf('vite') !== -1 ||
            msg.indexOf('failed to connect to websocket') !== -1 ||
            msg.indexOf('WebSocket closed without opened') !== -1
          ) {
            event.stopImmediatePropagation();
            event.preventDefault();
            return true;
          }
        }, true);

        window.addEventListener('unhandledrejection', function (event) {
          var reason = event ? (event.reason ? (event.reason.message || String(event.reason)) : '') : '';
          if (
            typeof reason === 'string' && (
              reason.indexOf('WebSocket') !== -1 ||
              reason.indexOf('websocket') !== -1 ||
              reason.indexOf('WebSocket closed without opened') !== -1 ||
              reason.indexOf('failed to connect to websocket') !== -1 ||
              reason.indexOf('vite') !== -1
            )
          ) {
            event.stopImmediatePropagation();
            event.preventDefault();
          }
        }, true);

        // 4. Auto-remove any Vite error overlay element if created
        if (typeof MutationObserver !== 'undefined') {
          new MutationObserver(function (mutations) {
            for (var i = 0; i < mutations.length; i++) {
              var added = mutations[i].addedNodes;
              for (var j = 0; j < added.length; j++) {
                var el = added[j];
                if (el && el.nodeName && el.nodeName.toLowerCase().indexOf('vite-error-overlay') !== -1) {
                  el.remove();
                }
              }
            }
          }).observe(document.documentElement, { childList: true, subtree: true });
        }
      })();
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Orbitron:wght@500;700;900&family=JetBrains+Mono:wght@400;500;700&family=Noto+Sans+Tamil:wght@400;600;700&family=Anek+Tamil:wght@400;600;700&display=swap" rel="stylesheet">
  </head>
  <body class="bg-[#030712] text-slate-100 overflow-hidden select-none">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
